*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f0;color:#333;font-size:17px;}
.top{background:#fff;padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.top h1{font-size:16px;color:#2e7d32;margin-bottom:2px;}
.top .info{font-size:12px;color:#888;}
.stat-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.stat{flex:1;min-width:55px;text-align:center;background:#f9f9f4;border-radius:6px;padding:6px 8px;}
.stat .v{font-size:24px;font-weight:700;line-height:1.2;}
.stat .l{font-size:12px;color:#888;}
.v.g{color:#2e7d32;}.v.o{color:#e65100;}.v.b{color:#1565c0;}
.bar-wrap{height:4px;background:#e0e0e0;border-radius:2px;margin-top:6px;}
.bar{height:100%;background:#2e7d32;border-radius:2px;transition:width .3s;}
.ctrls{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid #e0e0d8;flex-wrap:wrap;align-items:center;}
.ctrls input{flex:1;min-width:120px;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:16px;}
.ctrls select{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:16px;background:#fff;}
.btn{padding:8px 16px;border:1px solid #ddd;border-radius:6px;background:#fff;font-size:15px;cursor:pointer;white-space:nowrap;}
.btn:active{background:#eee;}
.btn.g{background:#2e7d32;color:#fff;border-color:#2e7d32;}
.btn.r{background:#c62828;color:#fff;border-color:#c62828;}
.btn.s{padding:6px 12px;font-size:14px;}
.ftag{padding:5px 12px;border-radius:14px;font-size:14px;border:1px solid #ddd;background:#fff;cursor:pointer;}
.ftag.on{background:#2e7d32;color:#fff;border-color:#2e7d32;}
.ftag.wo.on{background:#e65100;border-color:#e65100;}

.list{padding:8px 12px;}
.card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-radius:8px;margin-bottom:6px;border:1px solid #f0f0e8;cursor:pointer;transition:background .1s;}
.card:active{background:#f5f5ee;}
.card .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.card .mid{flex:1;min-width:0;}
.card .mid .nm{font-weight:600;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .mid .sub{font-size:20px;color:#888;margin-top:2px;}
.card .arrow{color:#ccc;font-size:20px;flex-shrink:0;}

.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:16px 16px 24px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;box-shadow:0 -4px 20px rgba(0,0,0,0.1);}
.modal h3{font-size:26px;color:#2e7d32;margin-bottom:12px;}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5ee;font-size:20px;}
.row .k{color:#888;}
.row .v{font-weight:500;text-align:right;word-break:break-all;max-width:60%;}
.fld{margin-top:10px;}
.fld label{font-size:14px;color:#888;display:block;margin-bottom:3px;}
.fld input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:20px;}
.fld input:focus{outline:none;border-color:#2e7d32;}
.btns{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.btns .btn{flex:1;text-align:center;padding:16px;font-size:19px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;font-size:15px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.s{opacity:1;}
.hint{text-align:center;padding:20px;color:#888;font-size:15px;}
.jump{display:flex;gap:3px;align-items:center;font-size:13px;}
.jump input{width:36px;padding:4px 2px;border:1px solid #ddd;border-radius:4px;text-align:center;font-size:15px;}

.qbtn.sel{border-color:#4caf50;background:#e8f5e9;font-weight:700;color:#2e7d32;}
.qlabel{font-size:16px;color:#888;margin-top:8px;}

.scan-overlay .scan-close{position:absolute;top:16px;right:16px;z-index:1;background:rgba(0,0,0,0.6);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;}
.scan-overlay .scan-hint{position:absolute;bottom:40px;left:0;right:0;text-align:center;color:#fff;font-size:14px;z-index:1;}
</style>

// Auto-sync: dual channel - write to cloud, read from relay
const CLOUD='https://jsonblob.com/api/jsonBlob/019f82d1-df9f-7c3c-bb69-80b56e5f900b';
let syncVer=0, pollTimer=null;

function save(){localStorage.setItem('t1_v3',JSON.stringify(ED));}

async function cloudPush(){
  try{
    syncVer++;
    await fetch(CLOUD,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ver:syncVer,data:ED,ts:Date.now()})});
  }catch(e){}
}

async function cloudPull(){
  try{
    const resp=await fetch(CLOUD+'?_='+Date.now());
    if(!resp.ok)return;
    const remote=await resp.json();
    if(!remote||!remote.data)return;
    syncVer=remote.ver||0;
    let n=0;
    for(const[id,v]of Object.entries(remote.data)){
      if(id==='test'||id==='ts')continue;
      if(!ED[id]){ED[id]=v;n++;}
      else{
        if(!ED[id].sf&&v.sf){ED[id].sf=v.sf;n++;}
        if(!ED[id].ts&&v.ts){ED[id].ts=v.ts;n++;}
        if(v.scrapped&&!ED[id].scrapped){ED[id].scrapped=true;n++;}
      }
    }
    if(n>0){save();render();toast('📥 '+n+'条已同步');}
  }catch(e){}
}

pollTimer=setInterval(cloudPull,3000);
cloudPull();

function copyLink(){
  const parts=[];
  for(const[id,v]of Object.entries(ED)){
    if((v.sf&&v.sf.trim())||(v.ts&&v.ts.trim())||v.scrapped)
      parts.push(id+'='+(v.sf||'')+','+(v.ts||'')+','+(v.scrapped?'1':'0'));
  }
  if(!parts.length){toast('暂无数据');return;}
  const enc=btoa(unescape(encodeURIComponent(parts.join('|'))));
  navigator.clipboard.writeText(location.origin+location.pathname+'#'+enc).then(()=>toast('📋 已复制'));
}

      const[idx,vals]=p.split('=');
      if(!idx||!vals)continue;
      const s=vals.split(',');
      if(!ED[idx]){ED[idx]={};n++;}
      else if(ED[idx].sf||ED[idx].ts||ED[idx].scrapped)continue;

}

function gs(d){return(ED[d.id]&&ED[d.id].sf!==undefined)?ED[d.id].sf:d.sf;}
function gt(d){return(ED[d.id]&&ED[d.id].ts!==undefined)?ED[d.id].ts:d.ts;}
function hs(d){const v=gs(d);return v&&String(v).trim()!=='';}
function ht(d){const v=gt(d);return v&&String(v).trim()!=='';}
function done(d){const ed=ED[d.id];return hs(d)&&ht(d)||!!(ed&&ed.scrapped);}
function scrapped(d){return !!(ED[d.id]&&ED[d.id].scrapped);}
function fmt(v){if(!v)return'❌';if(v==='报废')return'报废';const m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return m[2].replace(/^0/,'')+'/'+m[3].replace(/^0/,'');return v;}

function syncIn(){
  const hash=window.location.hash.slice(1);
  if(!hash)return 0;
  try{
    const raw=decodeURIComponent(escape(atob(hash)));
    const pipe=raw.indexOf('|');
    let sid='',rest=raw;
    if(pipe>0){sid=raw.substring(0,pipe);rest=raw.substring(pipe+1);}
    if(sid&&!syncId){syncId=sid;localStorage.setItem('t1_sync_id',syncId);}
    if(!rest)return 0;
    const parts=rest.split('|');
    let n=0;
    for(const p of parts){
      const[idx,vals]=p.split('=');
      if(!idx||!vals)continue;
      const seg=vals.split(',');
      const sf=seg[0]||'',ts=seg[1]||'',sc=seg[2]==='1';
      if(!ED[idx]){ED[idx]={};n++;}
      else if(ED[idx].sf||ED[idx].ts||ED[idx].scrapped)continue;
      else n++;
      ED[idx].sf=sf;ED[idx].ts=ts;
      if(sc)ED[idx].scrapped=true;
    }
    if(n>0){save();toast('📥 从链接同步了 '+n+' 条');}
    return n;
  }catch(e){console.log('Sync parse error:',e);return 0;}
}

function updateQRUrl(){
  const el=document.getElementById('qrTxt');
  if(el)el.textContent=window.location.href;
}

let FL='all', SEL=null, skipAuto=false;

// Render
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let rows=D.slice();
  if(FL==='no') rows=rows.filter(d=>!done(d));
  else if(FL==='ok') rows=rows.filter(d=>done(d));
  if(q) rows=rows.filter(d=>d.id.toLowerCase().includes(q)||d.nm.toLowerCase().includes(q)||d.fe.toLowerCase().includes(q)||d.ma.toLowerCase().includes(q));

  const l=document.getElementById('list');
  if(rows.length===0){l.innerHTML='';document.getElementById('hint').textContent='没有匹配的小区';}
  else if(!skipAuto&&rows.length>300&&FL==='all'&&!q){
    const no=rows.filter(d=>!done(d));
    l.innerHTML='';
    document.getElementById('hint').textContent=`共${rows.length}个小区，已自动筛选${no.length}个未调查的。请用搜索或切换筛选。`;
    rows=no;
    renderCards(rows,l);
  }else{
    document.getElementById('hint').textContent=`共 ${rows.length} 个小区`;
    renderCards(rows,l);
  }
  skipAuto=false;
  renderStats();
}

function renderCards(rows,l){
  let h='';
  for(const d of rows){
    const ok=done(d), sf=hs(d), ts=ht(d), sc=scrapped(d);
    const clr=sc?'#bdbdbd':(ok?'#66bb6a':(sf||ts?'#ffd54f':'#ef5350'));
    h+=`<div class="card" data-id="${d.id}" onclick="sel(${d.r},${d.c})">
      <div class="dot" style="background:${clr}"></div>
      <div class="mid">
        <div class="nm">${d.id}${sc?' <span style=\"color:#757575\">[报废]</span>':''}</div>
        <div class="sub">排${d.r} 列${d.c} | 散粉:${sc?'-':fmt(gs(d))} 吐丝:${sc?'-':fmt(gt(d))}</div>
      </div>
      <span class="arrow">›</span>
    </div>`;
  }
  l.innerHTML=h;
}

function renderStats(){
  let ok=0,no=0,par=0;
  D.forEach(d=>{
    if(done(d))ok++;
    else if(hs(d)||ht(d))par++;
    else no++;
  });
  const pct=D.length?Math.round(ok/D.length*100):0;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="v">${D.length}</div><div class="l">总小区</div></div>
    <div class="stat"><div class="v g">${ok}</div><div class="l">已完成</div></div>
    <div class="stat"><div class="v o">${no}</div><div class="l">未调查</div></div>
    <div class="stat"><div class="v b">${par}</div><div class="l">部分完成</div></div>
    <div class="stat"><div class="v b">${pct}%</div><div class="l">完成率</div></div>
  `;
  document.getElementById('bar').style.width=pct+'%';
}

function setF(f,el){

// Cell selection
function sel(r,c){
  const i=GR[r]?.[c];
  if(i===undefined)return;
  const d=D[i]; SEL=i;
  editModal(d);

// Jump
function jump(){
  const r=+document.getElementById('jR').value,c=+document.getElementById('jC').value;
  if(r<G.rs||r>G.re||c<G.cs||c>G.ce){toast('位置无效');return;}
  const i=GR[r]?.[c];
  if(i===undefined&&MS.has(r+','+c)){toast('该位置为空位');return;}
  if(i===undefined){toast('无数据');return;}
  const d=D[i]; SEL=i;
  // Scroll to card
  document.getElementById('q').value=d.id;
  FL='all';document.querySelectorAll('.ftag').forEach(t=>t.classList.remove('on'));
  document.querySelector('[data-f="all"]').classList.add('on');
  render();

function searchJump(){

// Live camera scan
let scanStream=null,scanTimer=null,scanCanvas=null,scanCtx=null;

async function startLiveScan(){
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}}});
    const video=document.getElementById('scanVideo');
    video.srcObject=scanStream;
    await video.play();
    scanCanvas=document.createElement('canvas');
    scanCanvas.width=640;scanCanvas.height=480;
    scanCtx=scanCanvas.getContext('2d');
    document.getElementById('scanOverlay').style.display='flex';
    document.getElementById('scanHint').textContent='将二维码对准框内';
    scanLoop();
  }catch(e){
    // Fallback to photo mode
    document.getElementById('camIn').click();
  }
}

function scanLoop(){
  if(!scanStream)return;
  const video=document.getElementById('scanVideo');
  if(video.readyState<2){scanTimer=requestAnimationFrame(scanLoop);return;}
  scanCtx.drawImage(video,0,0,640,480);
  const data=scanCtx.getImageData(0,0,640,480);
  if(typeof jsQR!=='undefined'){
    const code=jsQR(data.data,640,480);
    if(code){
      const uid=code.data.trim();
      const m=uid.match(/[?&](?:id|uid)=([^&]+)/i);
      const clean=m?decodeURIComponent(m[1]):uid;
      stopLiveScan();
      const d=D.find(x=>x.id===clean);
      if(!d){toast('未找到: '+clean);return;}
      // Render full list and scroll to card
      FL='all';document.querySelectorAll('.ftag').forEach(t=>t.classList.remove('on'));
      document.querySelector('[data-f="all"]').classList.add('on');
      skipAuto=true;render();
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          const card=document.querySelector('.card[data-id="'+clean+'"]');
          if(card){
            window.scrollTo({top:card.offsetTop-130,behavior:'smooth'});
            card.style.outline='3px solid #1565c0';
            card.style.background='#e3f2fd';
            setTimeout(()=>{card.style.outline='';card.style.background='';},4000);
          }
        });
      });
      return;
    }
  }
  scanTimer=requestAnimationFrame(scanLoop);
}

function stopLiveScan(){
  if(scanTimer){cancelAnimationFrame(scanTimer);scanTimer=null;}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
  document.getElementById('scanOverlay').style.display='none';
  // Keep the hidden file input as fallback
  document.getElementById('camIn').value='';
}

function dayOffset(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function dateLabel(n){const d=dayOffset(n);const m=d.slice(5,7).replace(/^0/,'');const day=d.slice(8,10).replace(/^0/,'');const labels={'-2':'前天','-1':'昨天','0':'今天','1':'明天','2':'后天'};return labels[''+n]+' '+m+'/'+day;}
function dateBtn(uid,field,n){return '<button class=qbtn data-f='+field+' data-n='+n+' onclick=setDate(\"'+field+'\",'+n+',\"'+uid+'\")>'+dateLabel(n)+'</button>';}
function setDate(field,n,uid){
  const d=dayOffset(n);
  if(!ED[uid])ED[uid]={};
  ED[uid][field]=d;

  document.querySelectorAll('.qbtn[data-f='+field+']').forEach(b=>b.classList.remove('sel'));

    if(bar)bar.style.display='flex';

}

// Edit modal
function editModal(d){
  const sf=gs(d),ts=gt(d), sc=scrapped(d);
  if(sc){
    document.getElementById('mdCt').innerHTML=`
      <h3>🗑 ${d.id} [报废]</h3>
      <div class="row"><span class="k">位置</span><span class="v">排${d.r} 列${d.c}</span></div>
      <div class="btns"><button class="btn" onclick="closeM()">✕ 关</button></div>`;
    document.getElementById('mdBg').style.display='flex';return;
  }
  document.getElementById('mdCt').innerHTML=`
    <h3>${done(d)?'✅':'⚠️'} ${d.id}</h3>
    <div class="row"><span class="k">位置</span><span class="v">排${d.r} 列${d.c}</span></div>
    <div class="qlabel">🌾 散粉期 ${sf?'<b>'+fmt(sf)+'</b>':'未填'}</div>
    <div class="qdates">${dateBtn(d.id,'sf',-2)}${dateBtn(d.id,'sf',-1)}${dateBtn(d.id,'sf',0)}${dateBtn(d.id,'sf',1)}${dateBtn(d.id,'sf',2)}</div>
    <div class="qlabel">🌽 吐丝期 ${ts?'<b>'+fmt(ts)+'</b>':'未填'}</div>
    <div class="qdates">${dateBtn(d.id,'ts',-2)}${dateBtn(d.id,'ts',-1)}${dateBtn(d.id,'ts',0)}${dateBtn(d.id,'ts',1)}${dateBtn(d.id,'ts',2)}</div>
    <div id="confirmRow" style="display:${done(d)?'flex':'none'};align-items:center;gap:8px;margin-top:10px;padding:10px;background:#e8f5e9;border-radius:8px;">
      <span style="flex:1;font-size:16px;color:#2e7d32;">🌾${fmt(gs(d))} 🌽${fmt(gt(d))}</span>
      <button class="btn g" onclick="closeM();render();setTimeout(()=>nav(1),100)" style="flex:1;font-size:18px;">✅ 确认，下一个</button>
    </div>
    <div class="btns">
      <button class="btn r" onclick="delOne('${d.id}')">🗑 清除</button>
      <button class="btn" onclick="nav(-1)">◀ 上</button>
      <button class="btn" onclick="nav(1)">下 ▶</button>
      <button class="btn" onclick="closeM()">✕ 关</button>
    </div>
  `;
  document.getElementById('mdBg').style.display='flex';
}

function saveOne(id){closeM();render();}

function delOne(id){
  if(!ED[id])ED[id]={};
  ED[id].sf='';ED[id].ts='';
  save();closeM();render();toast('🗑 已清除');
}

function nav(dir){
  if(SEL===null)return;
  // Skip scrapped and done plots
  let i=SEL+dir, tries=0;
  while(tries<D.length){
    if(i<0)i=D.length-1;
    if(i>=D.length)i=0;
    if(!done(D[i])&&!scrapped(D[i]))break;
    i+=dir;tries++;
  }
  SEL=i;
  editModal(D[i]);
}
function closeM(){document.getElementById('mdBg').style.display='none';}

// Export
function exportCSV(){
  let csv='唯一编号,品种名称,排,列,散粉期,吐丝期,母本,父本,密度,对照类型,抽雄期\n';
  D.forEach(d=>csv+=`"${d.id}","${d.nm}",${d.r},${d.c},"${gs(d)}","${gt(d)}","${d.fe}","${d.ma}","${d.de}","${d.ct}","${d.cx}"\n`);
  const b=new Blob(['\uFEFF'+csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='T1-5000_调查.csv';a.click();
  toast('📥 导出成功');
}

// Toast
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('s');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('s'),2000);}
function copyLink(){
  const parts=[];
  for(const[id,v]of Object.entries(ED)){
    if((v.sf&&v.sf.trim())||(v.ts&&v.ts.trim())||v.scrapped){
      parts.push(id+'='+(v.sf||'')+','+(v.ts||'')+','+(v.scrapped?'1':'0'));
    }
  }
  const raw=parts.join('|');
  if(!raw){toast('暂无数据');return;}
  const enc=btoa(unescape(encodeURIComponent(raw)));
  navigator.clipboard.writeText(window.location.origin+window.location.pathname+'#'+enc).then(()=>toast('📋 已复制同步链接'));
}

// Init
syncIn();
render();

// Auto-jump from URL params
const sp=new URLSearchParams(window.location.search);
const jr=+sp.get('r'),jc=+sp.get('c');
const juid=sp.get('id')||sp.get('uid');
if(jr&&jc) setTimeout(()=>{document.getElementById('jR').value=jr;document.getElementById('jC').value=jc;jump();},300);
else if(juid) setTimeout(()=>{document.getElementById('q').value=juid;searchJump();},300);
console.log('T1-5000 ready. Total:',D.length,'Unsurveyed:',D.filter(d=>!done(d)).length);
</script>

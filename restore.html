<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>数据恢复</title></head>
<body style="font-family:sans-serif;padding:20px;text-align:center;">
<h2>正在恢复调查数据...</h2>
<p id="msg"></p>
<script>
(async function(){
  try {
    const resp = await fetch('survey_backup.json');
    const data = await resp.json();
    localStorage.setItem('t1_v4', JSON.stringify(data));
    document.getElementById('msg').textContent = '✅ 已恢复 ' + Object.keys(data).length + ' 条记录，正在跳转...';
    setTimeout(() => location.href = 'index.html', 1500);
  } catch(e) {
    document.getElementById('msg').textContent = '❌ 恢复失败: ' + e.message;
  }
})();
</script>
</body></html>
